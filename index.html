<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --card: #ffffff;
    --border: #e5e3dc;
    --ink: #2a2a2a;
    --muted: #777472;
    --label: #908b85;
    --pill-bg: #fde2dc;
    --pill-ink: #b54935;
    --accent: #b54935;
    --accent-hover: #963c2c;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --soft: #faf6f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }
  header.site { text-align: center; margin: 8px 0 28px; }
  header.site h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; }
  header.site p.tag { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; min-width: 110px; box-shadow: var(--shadow); }
  .stat .k { color: var(--label); font-size: 12px; font-weight: 500; }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; }

  a.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: #cdc7be; }
  a.card:active { transform: scale(.997); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; background: var(--pill-bg); color: var(--pill-ink); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
  a.card h2 { font-size: 19px; font-weight: 600; margin: 0; }
  a.card p.intro { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

  .program { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 22px 18px; box-shadow: var(--shadow); }
  .program-head h2 { margin: 8px 0 6px; font-size: 22px; }
  .program-head p.intro { color: var(--muted); margin: 0; font-size: 15px; }

  .meta-line { color: var(--label); font-size: 13px; margin-top: 10px; }

  .simple-row { display: grid; grid-template-columns: 80px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .simple-row:last-child { border-bottom: 0; }
  .simple-row .lbl { color: var(--label); font-size: 14px; font-weight: 500; padding-top: 1px; }
  .simple-row .txt { font-size: 15.5px; }

  .block { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .block:last-child { border-bottom: 0; }
  .block-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .block-head .lbl { color: var(--label); font-size: 14px; font-weight: 500; }
  .block-head .ttl { font-size: 16px; font-weight: 600; }

  .block-body { display: grid; grid-template-columns: 1fr 200px; gap: 16px; align-items: start; }
  ul.drills { margin: 0; padding: 0; list-style: none; }
  ul.drills li { padding: 8px 0 8px 0; font-size: 15.5px; border-bottom: 1px dashed #ededea; }
  ul.drills li:last-child { border-bottom: 0; }
  ul.drills li .en { color: var(--muted); font-size: 13.5px; }
  ul.drills li .reps { color: var(--accent); font-weight: 500; }

  a.video-inline { display: block; background: var(--soft); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
  a.video-inline:hover { border-color: #cdc7be; }
  a.video-inline:active { transform: scale(.99); }
  a.video-inline .thumb { display: block; aspect-ratio: 1/1; background: #eee no-repeat center/cover; position: relative; }
  a.video-inline .thumb::after { content: '▶'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: white; background: rgba(0,0,0,.55); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 16px; padding-right: 3px; }
  a.video-inline .meta { padding: 8px 10px 10px; }
  a.video-inline .uploader { font-size: 12.5px; color: var(--label); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  a.video-inline .watch { font-size: 12.5px; color: var(--accent); }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 16px; padding: 6px 0; }
  .back:hover { color: var(--accent-hover); }

  @media (max-width: 600px) {
    .block-body { grid-template-columns: 1fr; }
    a.video-inline { max-width: 280px; }
  }
  @media (max-width: 480px) {
    main { padding: 18px 14px 60px; }
    header.site h1 { font-size: 24px; }
    .program { padding: 18px 16px 12px; }
    .simple-row { grid-template-columns: 64px 1fr; gap: 10px; }
    .simple-row .lbl { font-size: 13px; }
    .simple-row .txt { font-size: 15px; }
    ul.drills li { font-size: 15px; }
  }
</style>

const ORDER = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday'];

function fmtDuration(s) {
  s = Math.round(s);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m > 0 ? m + ':' + String(r).padStart(2,'0') : '0:' + String(r).padStart(2,'0');
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function videoCard(videoId) {
  const v = VIDEOS[videoId];
  if (!v) return null;
  const card = el('a', { class: 'video-inline', href: v.url, target: '_blank', rel: 'noopener noreferrer' });
  const thumb = el('span', { class: 'thumb' });
  thumb.style.backgroundImage = "url('assets/thumbs/" + videoId + ".jpg')";
  card.appendChild(thumb);
  card.appendChild(el('div', { class: 'meta' },
    el('div', { class: 'uploader' },
      el('span', {}, v.uploader),
      el('span', {}, fmtDuration(v.duration)),
    ),
    el('div', { class: 'watch' }, '▶ צפה בפייסבוק'),
  ));
  return card;
}

function renderLanding() {
  const root = el('div', {});
  root.appendChild(el('header', { class: 'site' },
    el('h1', {}, 'תוכנית אימוני כדורגל שבועית'),
    el('p', { class: 'tag' }, 'דגש על טכניקה · אימון עצמאי עם כדור וקונוסים'),
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, el('div', { class: 'k' }, 'ימים בשבוע'), el('div', { class: 'v' }, '5')),
      el('div', { class: 'stat' }, el('div', { class: 'k' }, 'משך אימון'), el('div', { class: 'v' }, '~45 דק׳')),
      el('div', { class: 'stat' }, el('div', { class: 'k' }, 'ציוד'), el('div', { class: 'v' }, 'כדור + קונוסים')),
    ),
  ));
  for (const k of ORDER) {
    const p = PROGRAMS[k];
    root.appendChild(el('a', { class: 'card', href: '#/' + k },
      el('div', { class: 'card-head' },
        el('span', { class: 'pill' }, p.day),
        el('h2', {}, p.title),
      ),
      el('p', { class: 'intro' }, p.intro),
    ));
  }
  return root;
}

function renderProgram(key) {
  const p = PROGRAMS[key];
  const root = el('div', {});
  root.appendChild(el('a', { class: 'back', href: '#/' }, '→ חזרה לכל התוכניות'));
  const prog = el('div', { class: 'program' });

  prog.appendChild(el('div', { class: 'program-head' },
    el('div', { class: 'card-head' }, el('span', { class: 'pill' }, p.day)),
    el('h2', {}, p.title),
    el('p', { class: 'intro' }, p.intro),
  ));

  prog.appendChild(el('div', { class: 'simple-row' },
    el('div', { class: 'lbl' }, 'חימום'),
    el('div', { class: 'txt' }, p.warmup),
  ));

  for (const b of p.blocks) {
    const block = el('div', { class: 'block' });
    block.appendChild(el('div', { class: 'block-head' },
      el('span', { class: 'lbl' }, b.label + ' —'),
      el('span', { class: 'ttl' }, b.title),
    ));
    const body = el('div', { class: 'block-body' });
    const ul = el('ul', { class: 'drills' });
    for (const d of b.drills) {
      ul.appendChild(el('li', {},
        el('span', {}, d.he),
        el('span', { class: 'en' }, ' (' + d.en + ')  '),
        el('span', { class: 'reps' }, d.reps),
      ));
    }
    body.appendChild(ul);
    const vc = videoCard(b.videoId);
    if (vc) body.appendChild(vc);
    block.appendChild(body);
    prog.appendChild(block);
  }

  prog.appendChild(el('div', { class: 'simple-row' },
    el('div', { class: 'lbl' }, 'סיום'),
    el('div', { class: 'txt' }, p.cooldown),
  ));

  root.appendChild(prog);
  return root;
}

function render() {
  const route = (location.hash || '').replace(/^#\/?/, '');
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (PROGRAMS[route]) {
    app.appendChild(renderProgram(route));
  } else {
    app.appendChild(renderLanding());
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);
</script>
